<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Моя 3D модель на сайті</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; font-family: sans-serif; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            pointer-events: none;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div id="info">Натисніть **Пробіл**, щоб зупинити/запустити анімацію</div>

    <!-- Підключаємо Three.js та завантажувач через ES-модулі -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // 1. Сцена, камера, рендерер
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 1.5, 3);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        document.body.appendChild(renderer.domElement);

        // 2. Освітлення (щоб модель не була чорною)
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 2);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // 3. Контролери обертання мишею
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // 4. Змінні для анімації
        let mixer;
        let isPaused = false;
        const clock = new THREE.Clock();

        // 5. Завантаження нашої моделі (.glb)
        const loader = new GLTFLoader();
        loader.load('model.glb', function (gltf) {
            const model = gltf.scene;
            scene.add(model);

            // Якщо у файлі є анімація — запускаємо її
            if (gltf.animations && gltf.animations.length > 0) {
                mixer = new THREE.AnimationMixer(model);
                const action = mixer.clipAction(gltf.animations[0]); // беремо першу анімацію
                action.play();
            }
        }, undefined, function (error) {
            console.error('Помилка завантаження моделі:', error);
        });

        // 7. Обробка натискання клавіші "Пробіл" для паузи
        window.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault(); // щоб сторінка не прокручувалася вниз
                isPaused = !isPaused;
            }
        });

        // 6. Цикл рендерингу (анімаційний луп)
        function animate() {
            requestAnimationFrame(animate);
            
            const delta = clock.getDelta();
            
            // Оновлюємо анімацію тільки якщо вона не на паузі
            if (mixer && !isPaused) {
                mixer.update(delta);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Адаптивність при зміні розміру вікна
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
